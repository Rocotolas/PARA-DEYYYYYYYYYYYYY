<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I so mucho arrependidou wapatan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1e272e; /* Tono oscuro y reflexivo */
            color: #d2dae2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .ambiance {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 10%, #111518 90%);
            pointer-events: none;
            z-index: -2;
        }
     
        .message {
            font-size: 2.2rem;
            font-weight: 300;
            margin-bottom: 50px;
            letter-spacing: 2px;
            text-align: center;
            animation: fadeIn 3s ease-in-out;
            z-index: 10;
        }

        .container {
            width: 150px;
            height: 150px;
            animation: fadeIn 4s ease-in-out;
            z-index: 10;
        }

        .head {
            transform-origin: 35px 45px;
            animation: sigh 3.5s infinite alternate ease-in-out;
        }

        .cascade-text {
            position: absolute;
            color: rgba(210, 218, 226, 0.12); 
            white-space: nowrap;
            pointer-events: none; 
            animation: fall linear forwards;
            z-index: -1; 
            top: -10vh;
        }

        @keyframes sigh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-25deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fall {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="ambiance"></div>
    
    <div class="message">I so sorra, digo sorry, ya enserio, una gran disculpa y espero me puedas perdonar</div>
    
    <div class="container">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <g stroke="#d2dae2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
                
                <polyline points="50,65 50,90 75,90" />
                
                <line x1="35" y1="45" x2="50" y2="65" />
                
                <line x1="35" y1="45" x2="45" y2="80" />

                <g class="head">
                    <circle cx="25" cy="30" r="10" fill="#d2dae2" stroke="none" />
                </g>
                
            </g>
        </svg>
    </div>

    <script>
        function createCascadeText() {
            const textElement = document.createElement('div');
            textElement.classList.add('cascade-text');
            textElement.innerText = "Lo shientoo ";
            
            textElement.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 6 + 6;
            textElement.style.animationDuration = duration + 's';
            
            const size = Math.random() * 0.8 + 0.6;
            textElement.style.fontSize = size + 'rem';

            document.body.appendChild(textElement);

            setTimeout(() => {
                textElement.remove();
            }, duration * 1000);
        }

        setInterval(createCascadeText, 400);
    </script>
</body>
</html>
